
spring:
  application:
    name: back-end

  # Đọc biến môi trường từ file .env (nếu có) trong thư mục back-end
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hotel_management}
    username: ${DB_USERNAME:hotel}
    password: ${DB_PASSWORD:hotel}
    # Website nhỏ: 5 kết nối là đủ (mặc định 10), mỗi kết nối tốn thêm RAM ở PostgreSQL
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50

  servlet:
    multipart:
      # Ảnh gốc từ điện thoại có thể 5–8 MB; back-end tự nén còn vài trăm KB trước khi lưu
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8080
  # Chạy sau Caddy: lấy IP thật của người dùng từ X-Forwarded-For (chỉ tin proxy trong mạng nội bộ)
  forward-headers-strategy: native
  # Không trả stack trace ra ngoài
  error:
    include-stacktrace: never
  # VPS 2 GB RAM: tối đa 50 luồng xử lý (mặc định 200), mỗi luồng giữ ~0.5–1 MB RAM
  tomcat:
    threads:
      max: 50
      min-spare: 5

# Lưu ảnh upload
app:
  # local: lưu vào thư mục upload-dir (mặc định) | minio: lưu trên MinIO/S3
  storage: ${STORAGE_TYPE:local}
  # Chế độ local lưu ảnh vào thư mục này. Khi chạy thật nên dùng đường dẫn tuyệt đối.
  # Chế độ minio: ảnh cũ còn trong thư mục này được tự chép lên MinIO khi khởi động.
  upload-dir: ${UPLOAD_DIR:uploads}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:hotel-images}

  # JWT
  # Khi chạy thật PHẢI đặt biến môi trường JWT_SECRET
  # Chuỗi ngẫu nhiên, ít nhất 32 ký tự
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-hay-doi-khi-chay-that-0123456789}
    # Access token ngắn hạn; hết hạn thì front-end tự lấy token mới bằng refresh token
    expiration: 15m
    # Refresh token: không dùng 7 ngày thì hết hạn; mỗi lần làm mới được gia hạn,
    # nhưng một lần đăng nhập tối đa 30 ngày
    refresh-expiration: 7d
    session-max-age: 30d
    # Cookie refresh chỉ gửi qua HTTPS (trình duyệt vẫn chấp nhận trên http://localhost).
    # Chỉ đặt false khi chạy thử qua HTTP bằng IP/tên miền khác localhost
    cookie-secure: ${JWT_COOKIE_SECURE:true}

  # Tài khoản admin được tạo lần đầu chạy (nếu chưa có)
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
    full-name: ${ADMIN_FULL_NAME:Quản trị viên}

  # Front-end được phép gọi API (khi không dùng proxy của Vite)
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
