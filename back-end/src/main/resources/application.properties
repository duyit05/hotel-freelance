spring.application.name=back-end
server.port=8080

# ===== PostgreSQL (chạy bằng: docker compose up -d) =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/hotel}
spring.datasource.username=${DB_USERNAME:hotel}
spring.datasource.password=${DB_PASSWORD:hotel}

# Tự tạo/cập nhật bảng theo Entity (đủ dùng cho dự án nhỏ)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ===== Upload ảnh =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB
app.upload-dir=${UPLOAD_DIR:uploads}

# ===== JWT =====
# Khi chạy thật PHẢI đặt biến môi trường JWT_SECRET (chuỗi ngẫu nhiên, ít nhất 32 ký tự)
app.jwt.secret=${JWT_SECRET:dev-only-secret-hay-doi-khi-chay-that-0123456789}
app.jwt.expiration=8h

# ===== Tài khoản admin được tạo lần đầu chạy (nếu chưa có) =====
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}

# Front-end được phép gọi API (khi không dùng proxy của Vite)
app.cors-origins=${CORS_ORIGINS:http://localhost:5173}
